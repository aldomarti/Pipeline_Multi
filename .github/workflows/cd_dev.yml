name: CD_DEV
run-name: "CD-DEV-${{ github.event.inputs.version }}"

on:
  workflow_run:
    workflows:
      - "CI"
    types:
      - completed
    branches:
      - v1
  workflow_dispatch:
    inputs:
      version:
        description: "Numero de version (ej: 1.0.0)"
        required: true
        type: string
        default: "1.0.0"
      person-connect:
        description: "[Lambda] person-connect"
        type: boolean
        default: false
      person-login:
        description: "[Lambda] person-login"
        type: boolean
        default: false
      person-process:
        description: "[Lambda] person-process"
        type: boolean
        default: false
      castillo-connect:
        description: "[S3] castillo-connect"
        type: boolean
        default: false
      castillo-login:
        description: "[S3] castillo-login"
        type: boolean
        default: false
      balcazar-process:
        description: "[S3] balcazar-process"
        type: boolean
        default: false

env:
  VERSION: ${{ github.event.inputs.version }}

jobs:
  check-ci:
    runs-on: ubuntu-latest
    outputs:
      ci_status: ${{ steps.get_ci.outputs.conclusion }}
    steps:
      - name: Verificar ultimo resultado del pipeline CI
        id: get_ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow ci.yml \
            --branch main \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion')
          echo "CI conclusion: $conclusion"
          echo "conclusion=$conclusion" >> $GITHUB_OUTPUT

  block-on-ci-failure:
    needs: check-ci
    if: needs.check-ci.outputs.ci_status != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Error - CI no finalizo correctamente
        run: |
          echo "::error::El pipeline CI termino con estado '${{ needs.check-ci.outputs.ci_status }}'. El deploy a DEV fue bloqueado."
          exit 1
  Deploy:
    name: Deploy DEV
    needs: check-ci
    if: needs.check-ci.outputs.ci_status == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cargar variables de entorno
        run: |
          VARS_FILE="./variables/dev/default.yml"
          echo "---- Cargando variables desde $VARS_FILE ----"
          echo "AWS_REGION=$(yq e '.AWS_REGION' $VARS_FILE)" >> $GITHUB_ENV
          echo "AWS_USER_UPLOAD=$(yq e '.AWS_USER_UPLOAD' $VARS_FILE)" >> $GITHUB_ENV
          echo "AWS_REGION: $(yq e '.AWS_REGION' $VARS_FILE)"
          echo "AWS_USER_UPLOAD:   $(yq e '.AWS_USER_UPLOAD' $VARS_FILE)"
          echo "---------------------------------------------"

      - name: Proyectos seleccionados
        env:
          INPUT_PERSON_CONNECT: ${{ inputs.person-connect }}
          INPUT_PERSON_LOGIN: ${{ inputs.person-login }}
          INPUT_PERSON_PROCESS: ${{ inputs.person-process }}
          INPUT_CASTILLO_CONNECT: ${{ inputs.castillo-connect }}
          INPUT_CASTILLO_LOGIN: ${{ inputs.castillo-login }}
          INPUT_BALCAZAR_PROCESS: ${{ inputs.balcazar-process }}
        run: |
          echo "============================================"
          echo " Proyectos habilitados para despliegue"
          echo "============================================"
          count=$(yq e '.proyectos | length' ./config.yml)
          found=false
          for i in $(seq 0 $(($count - 1))); do
            pid=$(yq e ".proyectos[$i].proyectoid" ./config.yml)
            deploy_type=$(yq e ".proyectos[$i].deploy" ./config.yml)
            env_var="INPUT_$(echo "$pid" | tr '[:lower:]-' '[:upper:]_')"
            valor="${!env_var}"
            if [ "$valor" == "true" ]; then
              echo "  [x] $pid  (deploy: $deploy_type)"
              found=true
            else
              echo "  [ ] $pid"
            fi
          done
          echo "============================================"
          if [ "$found" == "false" ]; then
            echo "ADVERTENCIA: Ningún proyecto seleccionado."
          fi

