name: CD_UAT
run-name: "CD-UAT | ${{ github.event_name == 'workflow_dispatch' && format('proyecto: {0} | build: {1}', inputs.proyectos, inputs.ci_build_number) || format('ref: {0}', github.event.workflow_run.display_title) }}"

on:
  workflow_run:
    workflows:
      - "CD_DEV"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      proyectos:
        description: 'Selecciona el proyecto a desplegar'
        required: true
        default: "person-connect"
        type: choice
        options:
          - "person-connect"
          - "person-login"
          - "person-process"
      ci_build_number:
        description: 'Build number del CI (dejar en 0 para tomar el último exitoso automáticamente)'
        required: false
        default: '0'
        type: string

jobs:
  Promover:
    name: Promover imagen
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Obtener Build Number del CD_DEV
        id: build_number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            # Descargar artefacto build-info del run de CD_DEV que disparó este workflow
            RUN_ID="${{ github.event.workflow_run.id }}"
            echo "Descargando artefacto build-info del run ID: $RUN_ID"
            gh run download $RUN_ID --name build-info --dir ./build-info
            CI_RUN_NUMBER=$(cat ./build-info/ci_run_number.txt)
            echo "Origen: artefacto CD_DEV -> CI_RUN_NUMBER: $CI_RUN_NUMBER"
          elif [ "${{ inputs.ci_build_number }}" != "0" ] && [ -n "${{ inputs.ci_build_number }}" ]; then
            # Disparado manualmente con build number explícito
            CI_RUN_NUMBER="${{ inputs.ci_build_number }}"
            echo "Origen: workflow_dispatch (manual) -> run_number: $CI_RUN_NUMBER"
          else
            # Disparado manualmente sin build number: obtener el último run exitoso del CD_DEV via API
            CI_RUN_NUMBER=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/cd_dev.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].run_number')
            echo "Origen: workflow_dispatch (API) -> último run exitoso del CD_DEV: $CI_RUN_NUMBER"
          fi
          echo "TAGS=1.0.$CI_RUN_NUMBER" >> $GITHUB_ENV
          echo "CI_RUN_NUMBER=$CI_RUN_NUMBER" >> $GITHUB_ENV
          echo "Tag a desplegar: 1.0.$CI_RUN_NUMBER"

          # Guardar CI_RUN_NUMBER como artefacto para pasar a CD_PRD
          mkdir -p ./build-info
          echo "$CI_RUN_NUMBER" > ./build-info/ci_run_number.txt

      - name: Publicar build number como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: ./build-info/ci_run_number.txt
          retention-days: 1

      - name: Cargar variables de entorno
        run: |
          VARS_FILE="./variables/uat/default.yml"
          echo "---- Cargando variables desde $VARS_FILE ----"
          echo "AWS_REGION=$(yq e '.AWS_REGION' $VARS_FILE)" >> $GITHUB_ENV
          echo "AWS_USER_DOWNLOAD=$(yq e '.AWS_USER_DOWNLOAD' $VARS_FILE)" >> $GITHUB_ENV
          echo "AWS_USER_UPLOAD=$(yq e '.AWS_USER_UPLOAD' $VARS_FILE)" >> $GITHUB_ENV
          echo "AWS_REGION: $(yq e '.AWS_REGION' $VARS_FILE)"
          echo "AWS_USER_DOWNLOAD:   $(yq e '.AWS_USER_DOWNLOAD' $VARS_FILE)"
          echo "AWS_USER_UPLOAD:   $(yq e '.AWS_USER_UPLOAD' $VARS_FILE)"
          echo "---------------------------------------------"

      - name: Promover imagen a ECR UAT
        run: |
          echo "============================================"
          echo " Promoviendo imagenes DEV -> UAT"
          echo " Tag: ${{ env.TAGS }}"
          echo "============================================"

          # Login a ECR
          echo "Login a ECR"
          echo "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_USER_DOWNLOAD }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"

          echo "---- Proyectos a promover ----"
          yq e '.proyectos[] | .proyectoid + " | DEV: " + .ecrRepositoryDEV + " | UAT: " + .ecrRepositoryUAT' ./config.yml
          echo "------------------------------"

          # Iterar cada proyecto y promover imagen de DEV a UAT
          count=$(yq e '.proyectos | length' ./config.yml)
          for i in $(seq 0 $(($count - 1))); do
            proyectoid=$(yq e ".proyectos[$i].proyectoid" ./config.yml)
            ecrDEV=$(yq e ".proyectos[$i].ecrRepositoryDEV" ./config.yml)
            ecrUAT=$(yq e ".proyectos[$i].ecrRepositoryUAT" ./config.yml)

            uri_dev="${{ env.AWS_USER_DOWNLOAD }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ecrDEV:${{ env.TAGS }}"
            uri_uat="${{ env.AWS_USER_UPLOAD }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ecrUAT:${{ env.TAGS }}"

            echo "--- $proyectoid ---"
            echo "Pull DEV: $uri_dev"
            echo "docker pull $uri_dev"

          #######################################
          ### aqui tiene que ir el login a UAT
          #######################################
          
            echo "Tag UAT:  $uri_uat"
            echo "docker tag $uri_dev $uri_uat"

            echo "Push UAT: $uri_uat"
            echo "docker push $uri_uat"
          done
          echo "============================================"
          echo " Promocion completada"
          echo "============================================"


  Deploy:
    name: Deploy UAT
    needs: Promover
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Obtener Build Number del CD_DEV
        id: build_number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            # Descargar artefacto build-info del run de CD_DEV que disparó este workflow
            RUN_ID="${{ github.event.workflow_run.id }}"
            echo "Descargando artefacto build-info del run ID: $RUN_ID"
            gh run download $RUN_ID --name build-info --dir ./build-info
            CI_RUN_NUMBER=$(cat ./build-info/ci_run_number.txt)
            echo "Origen: artefacto CD_DEV -> CI_RUN_NUMBER: $CI_RUN_NUMBER"
          elif [ "${{ inputs.ci_build_number }}" != "0" ] && [ -n "${{ inputs.ci_build_number }}" ]; then
            # Disparado manualmente con build number explícito
            CI_RUN_NUMBER="${{ inputs.ci_build_number }}"
            echo "Origen: workflow_dispatch (manual) -> run_number: $CI_RUN_NUMBER"
          else
            # Disparado manualmente sin build number: obtener el último run exitoso del CD_DEV via API
            CI_RUN_NUMBER=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/cd_dev.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].run_number')
            echo "Origen: workflow_dispatch (API) -> último run exitoso del CD_DEV: $CI_RUN_NUMBER"
          fi
          echo "TAGS=1.0.$CI_RUN_NUMBER" >> $GITHUB_ENV
          echo "CI_RUN_NUMBER=$CI_RUN_NUMBER" >> $GITHUB_ENV
          echo "Tag a desplegar: 1.0.$CI_RUN_NUMBER"

      - name: Cargar variables de entorno
        run: |
          VARS_FILE="./variables/uat/default.yml"
          echo "---- Cargando variables desde $VARS_FILE ----"
          echo "AWS_REGION=$(yq e '.AWS_REGION' $VARS_FILE)" >> $GITHUB_ENV
          echo "AWS_USER_DOWNLOAD=$(yq e '.AWS_USER_DOWNLOAD' $VARS_FILE)" >> $GITHUB_ENV
          echo "AWS_USER_UPLOAD=$(yq e '.AWS_USER_UPLOAD' $VARS_FILE)" >> $GITHUB_ENV
          echo "AWS_REGION: $(yq e '.AWS_REGION' $VARS_FILE)"
          echo "AWS_USER_DOWNLOAD:   $(yq e '.AWS_USER_DOWNLOAD' $VARS_FILE)"
          echo "AWS_USER_UPLOAD:   $(yq e '.AWS_USER_UPLOAD' $VARS_FILE)"
          echo "---------------------------------------------"

      - name: Deploy to Lambda UAT
        run: |  
          echo "============================================"
          echo " Tag a desplegar: ${{ env.TAGS }}"
          echo "============================================"
          PROYECTO="${{ inputs.proyectos || 'person-connect' }}"

          # Buscar el proyecto en config.yml por proyectoid
          count=$(yq e '.proyectos | length' ./config.yml)
          encontrado=false
          for i in $(seq 0 $(($count - 1))); do
            pid=$(yq e ".proyectos[$i].proyectoid" ./config.yml)
            if [ "$pid" == "$PROYECTO" ]; then
              encontrado=true
              proyectoid=$pid
              ecrRepositoryUAT=$(yq e ".proyectos[$i].ecrRepositoryUAT" ./config.yml)
              LambdaUAT=$(yq e ".proyectos[$i].LambdaUAT" ./config.yml)
              break
            fi
          done

          if [ "$encontrado" == "false" ]; then
            echo "ERROR: Proyecto '$PROYECTO' no encontrado en config.yml"
            exit 1
          fi

          echo "---- Variables cargadas ----"
          echo "proyectoid:       $proyectoid"
          echo "ecrRepositoryUAT: $ecrRepositoryUAT"
          echo "LambdaUAT:        $LambdaUAT"
          echo "----------------------------"

          echo "aws lambda update-function-code --function-name $LambdaUAT --image-uri ${{ env.AWS_USER_UPLOAD }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ecrRepositoryUAT:${{ env.TAGS }}"