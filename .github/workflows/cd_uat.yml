name: CD_UAT
run-name: "CD - Deploy to Lambda UAT | ref CD_DEV: '${{ github.event.workflow_run.display_title }}' | manual build: ${{ inputs.ci_build_number || '(auto)' }} | por: ${{ github.actor }}"

on:
  workflow_run:
    workflows:
      - "CD_DEV"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      proyectos:
        description: 'Selecciona el proyecto a desplegar'
        required: true
        default: "person-connect"
        type: choice
        options:
          - "person-connect"
          - "person-login"
          - "person-process"
      ci_build_number:
        description: 'Build number del CI (dejar en 0 para tomar el último exitoso automáticamente)'
        required: false
        default: '0'
        type: string

jobs:
  Deploy:
    name: Deploy UAT
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Obtener Build Number del CD_DEV
        id: build_number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            # Descargar artefacto build-info del run de CD_DEV que disparó este workflow
            RUN_ID="${{ github.event.workflow_run.id }}"
            echo "Descargando artefacto build-info del run ID: $RUN_ID"
            gh run download $RUN_ID --name build-info --dir ./build-info
            CI_RUN_NUMBER=$(cat ./build-info/ci_run_number.txt)
            echo "Origen: artefacto CD_DEV -> CI_RUN_NUMBER: $CI_RUN_NUMBER"
          elif [ "${{ inputs.ci_build_number }}" != "0" ] && [ -n "${{ inputs.ci_build_number }}" ]; then
            # Disparado manualmente con build number explícito
            CI_RUN_NUMBER="${{ inputs.ci_build_number }}"
            echo "Origen: workflow_dispatch (manual) -> run_number: $CI_RUN_NUMBER"
          else
            # Disparado manualmente sin build number: obtener el último run exitoso del CD_DEV via API
            CI_RUN_NUMBER=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/cd_dev.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0].run_number')
            echo "Origen: workflow_dispatch (API) -> último run exitoso del CD_DEV: $CI_RUN_NUMBER"
          fi
          echo "TAGS=1.0.$CI_RUN_NUMBER" >> $GITHUB_ENV
          echo "CI_RUN_NUMBER=$CI_RUN_NUMBER" >> $GITHUB_ENV
          echo "Tag a desplegar: 1.0.$CI_RUN_NUMBER"

      - name: Cargar variables de entorno
        run: |
          VARS_FILE="./variables/dev/default.yml"
          echo "---- Cargando variables desde $VARS_FILE ----"
          echo "AWS_REGION=$(yq e '.AWS_REGION' $VARS_FILE)" >> $GITHUB_ENV
          echo "AWS_USER=$(yq e '.AWS_USER' $VARS_FILE)" >> $GITHUB_ENV
          echo "AWS_REGION: $(yq e '.AWS_REGION' $VARS_FILE)"
          echo "AWS_USER:   $(yq e '.AWS_USER' $VARS_FILE)"
          echo "---------------------------------------------"

      - name: Deploy to Lambda DEV
        run: |  
          echo "============================================"
          echo " Tag a desplegar: ${{ env.TAGS }}"
          echo "============================================"
          PROYECTO="${{ inputs.proyectos || 'person-connect' }}"

          # Buscar el proyecto en config.yml por proyectoid
          count=$(yq e '.proyectos | length' ./config.yml)
          encontrado=false
          for i in $(seq 0 $(($count - 1))); do
            pid=$(yq e ".proyectos[$i].proyectoid" ./config.yml)
            if [ "$pid" == "$PROYECTO" ]; then
              encontrado=true
              proyectoid=$pid
              ecrRepositoryDEV=$(yq e ".proyectos[$i].ecrRepositoryDEV" ./config.yml)
              LambdaDEV=$(yq e ".proyectos[$i].LambdaDEV" ./config.yml)
              break
            fi
          done

          if [ "$encontrado" == "false" ]; then
            echo "ERROR: Proyecto '$PROYECTO' no encontrado en config.yml"
            exit 1
          fi

          echo "---- Variables cargadas ----"
          echo "proyectoid:       $proyectoid"
          echo "ecrRepositoryDEV: $ecrRepositoryDEV"
          echo "LambdaDEV:        $LambdaDEV"
          echo "----------------------------"

          echo "aws lambda update-function-code --function-name $LambdaDEV --image-uri ${{ env.AWS_USER }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ecrRepositoryDEV:${{ env.TAGS }}"