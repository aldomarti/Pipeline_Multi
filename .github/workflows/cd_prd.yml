# Continuous Deployment - PRD

name: CD_PRD
run-name: "CD-PRD-${{ github.event.inputs.version }}"

on:
  workflow_run:
    workflows:
      - "CD_UAT"
    types:
      - completed
    branches:
      - v1
  workflow_dispatch:
    inputs:
      version:
        description: "Numero de version (ej: 1.0.0)"
        required: true
        type: string
        default: "1.0.0"
      proyectos:
        description: 'Selecciona el proyecto a desplegar'
        required: true
        default: "person-connect"
        type: choice
        options:
          - "person-connect"
          - "person-login"
          - "person-process"
          - "castillo-connect"
          - "castillo-login"
          - "balcazar-process"

env:
  VERSION: ${{ github.event.inputs.version }}

jobs:
  check-cd-uat:
    runs-on: ubuntu-latest
    outputs:
      cd_uat_status: ${{ steps.get_cd_uat.outputs.conclusion }}
    steps:
      - name: Verificar ultimo resultado del pipeline CD_UAT
        id: get_cd_uat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow cd_uat.yml \
            --branch v1 \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion')
          echo "CD_UAT conclusion: $conclusion"
          echo "conclusion=$conclusion" >> $GITHUB_OUTPUT

  block-on-uat-failure:
    needs: check-cd-uat
    if: needs.check-cd-uat.outputs.cd_uat_status != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Error - CD_UAT no finalizo correctamente
        run: |
          echo "::error::El pipeline CD_UAT termino con estado '${{ needs.check-cd-uat.outputs.cd_uat_status }}'. El deploy a PRD fue bloqueado."
          exit 1

  Promover:
    name: Promover imagen
    runs-on: ubuntu-latest
    needs: check-cd-uat
    if: needs.check-cd-uat.outputs.cd_uat_status == 'success'
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # - name: Obtener Build Number del CD_UAT
      #   id: build_number
      #   env:
      #     GH_TOKEN: ${{ github.token }}
      #   run: |
      #     if [ "${{ github.event_name }}" == "workflow_run" ]; then
      #       # Descargar artefacto build-info del run de CD_UAT que disparó este workflow
      #       RUN_ID="${{ github.event.workflow_run.id }}"
      #       echo "Descargando artefacto build-info del run ID: $RUN_ID"
      #       gh run download $RUN_ID --name build-info --dir ./build-info
      #       CI_RUN_NUMBER=$(cat ./build-info/ci_run_number.txt)
      #       echo "Origen: artefacto CD_UAT -> CI_RUN_NUMBER: $CI_RUN_NUMBER"
      #     elif [ "${{ inputs.ci_build_number }}" != "0" ] && [ -n "${{ inputs.ci_build_number }}" ]; then
      #       # Disparado manualmente con build number explícito
      #       CI_RUN_NUMBER="${{ inputs.ci_build_number }}"
      #       echo "Origen: workflow_dispatch (manual) -> run_number: $CI_RUN_NUMBER"
      #     else
      #       # Disparado manualmente sin build number: obtener el último run exitoso del CD_UAT via API
      #       CI_RUN_NUMBER=$(gh api \
      #         "repos/${{ github.repository }}/actions/workflows/cd_uat.yml/runs?status=success&per_page=1" \
      #         --jq '.workflow_runs[0].run_number')
      #       echo "Origen: workflow_dispatch (API) -> último run exitoso del CD_UAT: $CI_RUN_NUMBER"
      #     fi
      #     echo "TAGS=1.0.$CI_RUN_NUMBER" >> $GITHUB_ENV
      #     echo "CI_RUN_NUMBER=$CI_RUN_NUMBER" >> $GITHUB_ENV
      #     echo "Tag a desplegar: 1.0.$CI_RUN_NUMBER"

      - name: Cargar variables de entorno
        run: |
          VARS_FILE="./variables/prd/default.yml"
          echo "---- Cargando variables desde $VARS_FILE ----"
          echo "AWS_REGION=$(yq e '.AWS_REGION' $VARS_FILE)" >> $GITHUB_ENV
          echo "AWS_USER_DOWNLOAD=$(yq e '.AWS_USER_DOWNLOAD' $VARS_FILE)" >> $GITHUB_ENV
          echo "AWS_USER_UPLOAD=$(yq e '.AWS_USER_UPLOAD' $VARS_FILE)" >> $GITHUB_ENV
          echo "AWS_REGION: $(yq e '.AWS_REGION' $VARS_FILE)"
          echo "AWS_USER_DOWNLOAD:   $(yq e '.AWS_USER_DOWNLOAD' $VARS_FILE)"
          echo "AWS_USER_UPLOAD:   $(yq e '.AWS_USER_UPLOAD' $VARS_FILE)"
          echo "---------------------------------------------"

      - name: Promover imagen a ECR PRD
        run: |
          echo "============================================"
          echo " Promoviendo imagenes UAT -> PRD"
          echo " Tag: ${{ env.VERSION }}"
          echo "============================================"

          # Login a ECR
          echo "Login a ECR"
          echo "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_USER_DOWNLOAD }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"

          echo "---- Proyectos a promover ----"
          yq e '.proyectos[] | .proyectoid + " | UAT: " + .ecrRepositoryUAT + " | PRD: " + .ecrRepositoryPRD' ./config.yml
          echo "------------------------------"

          # Iterar cada proyecto y promover imagen de UAT a PRD
          count=$(yq e '.proyectos | length' ./config.yml)
          for i in $(seq 0 $(($count - 1))); do
            proyectoid=$(yq e ".proyectos[$i].proyectoid" ./config.yml)
            ecrPRD=$(yq e ".proyectos[$i].ecrRepositoryPRD" ./config.yml)
            ecrUAT=$(yq e ".proyectos[$i].ecrRepositoryUAT" ./config.yml)

            uri_uat="${{ env.AWS_USER_DOWNLOAD }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ecrUAT:${{ env.VERSION }}"
            uri_prd="${{ env.AWS_USER_UPLOAD }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ecrPRD:${{ env.VERSION }}"

            echo "--- $proyectoid ---"
            echo "Pull UAT: $uri_uat"
            echo "docker pull $uri_uat"

          #######################################
          ### aqui tiene que ir el login a PRD
          #######################################
          echo "Login a PRD"
          echo "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_USER_UPLOAD }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          
            echo "Tag UAT:  $uri_uat"
            echo "docker tag $uri_uat $uri_prd"

            echo "Push PRD: $uri_prd"
            echo "docker push $uri_prd"
          done
          echo "============================================"
          echo " Promocion completada"
          echo "============================================"


  Deploy:
    name: Deploy PRD
    needs: Promover
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cargar variables de entorno
        run: |
          VARS_FILE="./variables/prd/default.yml"
          echo "---- Cargando variables desde $VARS_FILE ----"
          echo "AWS_REGION=$(yq e '.AWS_REGION' $VARS_FILE)" >> $GITHUB_ENV
          echo "AWS_USER_UPLOAD=$(yq e '.AWS_USER_UPLOAD' $VARS_FILE)" >> $GITHUB_ENV
          echo "ARTIFACTORY_URL=$(yq e '.ARTIFACTORY_URL' $VARS_FILE)" >> $GITHUB_ENV
          echo "AWS_REGION:      $(yq e '.AWS_REGION' $VARS_FILE)"
          echo "AWS_USER_UPLOAD: $(yq e '.AWS_USER_UPLOAD' $VARS_FILE)"
          echo "ARTIFACTORY_URL: $(yq e '.ARTIFACTORY_URL' $VARS_FILE)"
          echo "---------------------------------------------"

      - name: Descargar artefacto desde Artifactory
        run: |
          PROYECTO="${{ inputs.proyectos }}"

          # Buscar proyectoid y leer deploy type
          count=$(yq e '.proyectos | length' ./config.yml)
          encontrado=false
          for i in $(seq 0 $(($count - 1))); do
            pid=$(yq e ".proyectos[$i].proyectoid" ./config.yml)
            if [ "$pid" == "$PROYECTO" ]; then
              encontrado=true
              deploy_type=$(yq e ".proyectos[$i].deploy" ./config.yml)
              break
            fi
          done

          if [ "$encontrado" == "false" ]; then
            echo "::error::Proyecto '$PROYECTO' no encontrado en config.yml"
            exit 1
          fi

          if [ "$deploy_type" == "s3" ]; then
            ZIP_FILE="${{ github.event.repository.name }}.zip"
            artifactoryUrl="${{ env.ARTIFACTORY_URL }}/dso-generic-release/$ZIP_FILE"

            echo "URL Artifactory: $artifactoryUrl"
            echo "Archivo zip:     $ZIP_FILE"

            if [ -f "$ZIP_FILE" ]; then
              echo ">> Artefacto '$ZIP_FILE' ya existe. Se omite la descarga."
            else
              echo ">> Descargando artefacto desde Artifactory..."
              # curl -fSL \
              #   -H "Authorization: Bearer ${{ secrets.ARTIFACTORY_TOKEN }}" \
              #   -o "$ZIP_FILE" \
              #   "$artifactoryUrl"
              echo ">> Descarga completada: $ZIP_FILE"
              #ls -lh "$ZIP_FILE"

              echo ">> Descomprimiendo $ZIP_FILE en $GITHUB_WORKSPACE..."
              #unzip -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE"
              echo ">> Contenido descomprimido:"
              #find "$GITHUB_WORKSPACE/${{ github.event.repository.name }}" -type f | sort

            fi
          else
            echo ">> Proyecto '$PROYECTO' tiene deploy tipo '$deploy_type'. No requiere descarga desde Artifactory."
          fi

      - name: Deploy
        run: |
          echo "============================================"
          echo " Tag a desplegar: ${{ env.VERSION }}"
          echo "============================================"

          PROYECTO="${{ inputs.proyectos }}"
          echo "Proyecto seleccionado: $PROYECTO"

          # Buscar proyectoid en config.yml
          count=$(yq e '.proyectos | length' ./config.yml)
          encontrado=false
          for i in $(seq 0 $(($count - 1))); do
            pid=$(yq e ".proyectos[$i].proyectoid" ./config.yml)
            if [ "$pid" == "$PROYECTO" ]; then
              encontrado=true
              deploy_type=$(yq e ".proyectos[$i].deploy" ./config.yml)
              break
            fi
          done

          if [ "$encontrado" == "false" ]; then
            echo "::error::Proyecto '$PROYECTO' no encontrado en config.yml"
            exit 1
          fi

          echo "deploy_type: $deploy_type"

          if [ "$deploy_type" == "lambda" ]; then
            ecrRepositoryDEV=$(yq e ".proyectos[$i].ecrRepositoryDEV" ./config.yml)
            LambdaDEV=$(yq e ".proyectos[$i].LambdaDEV" ./config.yml)
            echo "---- Variables Lambda ----"
            echo "ecrRepositoryDEV: $ecrRepositoryDEV"
            echo "LambdaDEV:        $LambdaDEV"
            echo "-------------------------"
            echo ">> Deploy Lambda:"
            echo "aws lambda update-function-code \ "
            echo "  --function-name \"$LambdaDEV\" \ "
            echo "  --image-uri \"${{ env.AWS_USER_UPLOAD }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ecrRepositoryDEV:${{ env.VERSION }}\""

          elif [ "$deploy_type" == "s3" ]; then
            pythonfilePath=$(yq e ".proyectos[$i].pythonfilePath" ./config.yml)
            s3RepositoryDEV=$(yq e ".proyectos[$i].s3RepositoryDEV" ./config.yml)
            S3path=$(yq e ".proyectos[$i].S3path" ./config.yml)
            echo "---- Variables S3 ----"
            echo "pythonfilePath:  $pythonfilePath"
            echo "s3RepositoryDEV: $s3RepositoryDEV"
            echo "S3path:          $S3path"
            echo "----------------------"
            echo ">> Deploy S3:"
            echo "aws s3 sync ".$pythonfilePath" "s3://$s3RepositoryDEV/$S3path" --delete"

          else
            echo "::error::Tipo de deploy desconocido '$deploy_type' para proyecto '$PROYECTO'"
            exit 1
          fi