name: CI
run-name: "CI/CD - Build & Push to ECR 1.0.${{ github.run_number }}"

on:
  push:
    branches:
       - main
#       - develop
#   pull_request:
#     branches:
#       - main
  workflow_dispatch:
    inputs:
      proyectos:
        description: 'Selecciona el proyecto a desplegar'
        required: true
        default: 'myproyecto1'
        type: choice
        options:
          - myproyecto1
          - myproyecto2
          - myproyecto3

env:
    TAGS: 1.0.${{ github.run_number }}
    AWS_REGION: "us-east-1"
    AWS_USER: "251763329048"
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: proyecto
        run: |
          echo "Proyecto seleccionado: ${{ inputs.proyectos || 'myproyecto1' }}"
        
      - name: Carga de variables y Build
        run: |
          set -e

          echo "---- Proyectos disponibles en config.yml ----"
          yq e '.proyectos[].proyectoid' ./config.yml
          echo "---------------------------------------------"

          # Iterar cada proyectoid y ejecutar docker buildx build
          while IFS= read -r proy; do
            echo "Docker images built: $proy"
            pathfile=./$proy/Dockerfile
            tag=$proy:${{ env.TAGS }}
            docker buildx build --file $pathfile --tag $tag .
          done < <(yq e '.proyectos[].proyectoid' ./config.yml)

          docker images

      - name: docker login and push to ECR
        run: |

          # Ejecutar docker login para ECR
          echo "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_USER }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"

          # Ejecutar docker tag y docker push para cada proyecto
          count=$(yq e '.proyectos | length' ./config.yml)
          for i in $(seq 0 $(($count - 1))); do
            proy=$(yq e ".proyectos[$i].proyectoid" ./config.yml)
            ecrDEV=$(yq e ".proyectos[$i].ecrRepositoryDEV" ./config.yml)

            local_tag=$proy:${{ env.TAGS }}
            ecr_uri="${{ env.AWS_USER }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ecrDEV:${{ env.TAGS }}"

            echo "Proyecto: $proy | ECR DEV: $ecrDEV"
            echo "docker tag $local_tag -> $ecr_uri"
            echo "docker tag $local_tag $ecr_uri"
            echo "docker push $ecr_uri"
            echo "docker push $ecr_uri"
          done

      # - name: Build Docker image 2
