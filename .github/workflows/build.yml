name: CI
run-name: "CI/CD - Build & Push to ECR 1.0.${{ github.run_number }}"

on:
  push:
    branches:
       - main
#       - develop
#   pull_request:
#     branches:
#       - main
  workflow_dispatch:
    inputs:
      proyectos:
        description: "Proyecto a desplegar"
        required: true
        default: "myproyecto1"
        type: choice
        options:
          - myproyecto1
          - myproyecto2
env:
    TAGS: 1.0.${{ github.run_number }}
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Carga de variables
        run: |
          CONFIG_FILE=".github/workflows/config.yml"
          PROYECTO="${{ inputs.proyectos }}"

          echo "============================================"
          echo " Proyecto seleccionado: $PROYECTO"
          echo "============================================"

          # Leer y exportar todas las variables del proyecto seleccionado
          while IFS="=" read -r key value; do
            echo "${key}=${value}" >> $GITHUB_ENV
          done < <(yq ".$PROYECTO | to_entries | .[] | .key + \"=\" + .value" $CONFIG_FILE)

          echo "---- Variables cargadas ----"
          yq ".$PROYECTO | to_entries | .[] | .key + \": \" + .value" $CONFIG_FILE
          echo "============================================"

