name: CI
run-name: "CI/CD - Build & Push to ECR 1.0.${{ github.run_number }}"

on:
  push:
    branches:
       - main
#       - develop
#   pull_request:
#     branches:
#       - main
  workflow_dispatch:
    inputs:
      proyectos:
        description: "Proyecto a desplegar"
        required: true
        default: "myproyecto1"
        type: choice
        options:
          - myproyecto1
          - myproyecto2
env:
    TAGS: 1.0.${{ github.run_number }}
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Carga de variables
        run: |
          # Stop execution if any command fails
          set -e

          #############
          #Obtener el archivo config.yml
          #############
          config=$(cat ./config.yml)
          echo "$config"
          
          #############
          #Parametros que se aplican en el despliegue, se obtienen del archivo config.yml
          #############
          echo "Obteniendo parametros del deployment"
          ecrRepositoryDEV=$(echo "$config" | yq e '.["${{ inputs.proyectos }}"].ecrRepositoryDEV' -)
          ecrRepositoryUAT=$(echo "$config" | yq e '.["${{ inputs.proyectos }}"].ecrRepositoryUAT' -)
          ecrRepositoryPRD=$(echo "$config" | yq e '.["${{ inputs.proyectos }}"].ecrRepositoryPRD' -)
          LambdaDEV=$(echo "$config" | yq e '.["${{ inputs.proyectos }}"].LambdaDEV' -)
          LambdaUAT=$(echo "$config" | yq e '.["${{ inputs.proyectos }}"].LambdaUAT' -)
          LambdaPRD=$(echo "$config" | yq e '.["${{ inputs.proyectos }}"].LambdaPRD' -)
          

          echo "ECR Repository DEV: $ecrRepositoryDEV"
          echo "ECR Repository UAT: $ecrRepositoryUAT"
          echo "ECR Repository PRD: $ecrRepositoryPRD"
          echo "Lambda DEV: $LambdaDEV"
          echo "Lambda UAT: $LambdaUAT"
          echo "Lambda PRD: $LambdaPRD"

