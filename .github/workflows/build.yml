name: CI
run-name: "CI/CD - Build & Push to ECR 1.0.${{ github.run_number }}"

on:
  push:
    branches:
       - main
#       - develop
#   pull_request:
#     branches:
#       - main
  workflow_dispatch:
    inputs:
      proyectos:
        description: 'Selecciona el proyecto a desplegar'
        required: true
        default: 'myproyecto1'
        type: choice
        options:
          - myproyecto1
          - myproyecto2

env:
    TAGS: 1.0.${{ github.run_number }}
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Carga de variables
        run: |
          # Stop execution if any command fails
          set -e

          #############
          #Obtener el archivo config.yml
          #############
          config=$(cat ./config.yml)
          echo "$config"
          
          #############
          #Parametros que se aplican en el despliegue, se obtienen del archivo config.yml
          #############
          echo "Obteniendo parametros del deployment"

          # Iterar las claves del archivo config.yml y ubicar el proyecto seleccionado
          echo: "${{ inputs.proyectos }}"
          PROYECTO="${{ inputs.proyectos }}"
          encontrado=false
          for key in $(echo "$config" | yq e 'keys | .[]' -); do
            if [ "$key" == "$PROYECTO" ]; then
              encontrado=true
              echo "Proyecto encontrado: $key"
              ecrRepoDEV=$(echo "$config" | yq e ".${key}.ecrRepositoryDEV" -)
              ecrRepoUAT=$(echo "$config" | yq e ".${key}.ecrRepositoryUAT" -)
              ecrRepoPRD=$(echo "$config" | yq e ".${key}.ecrRepositoryPRD" -)
              LambDEV=$(echo "$config" | yq e ".${key}.LambdaDEV" -)
              LambUAT=$(echo "$config" | yq e ".${key}.LambdaUAT" -)
              LambPRD=$(echo "$config" | yq e ".${key}.LambdaPRD" -)
              break
            fi
          done

          if [ "$encontrado" == "false" ]; then
            echo "ERROR: Proyecto '$PROYECTO' no encontrado en config.yml"
            exit 1
          fi
          

          echo "ECR Repository DEV: $ecrRepoDEV"
          echo "ECR Repository UAT: $ecrRepoUAT"
          echo "ECR Repository PRD: $ecrRepoPRD"
          echo "Lambda DEV: $LambDEV"
          echo "Lambda UAT: $LambUAT"
          echo "Lambda PRD: $LambPRD"

