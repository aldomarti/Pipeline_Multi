name: CI
run-name: "CI/CD - Build & Push to ECR 1.0.${{ github.run_number }}"

on:
  push:
    branches:
       - main
#       - develop
#   pull_request:
#     branches:
#       - main
  workflow_dispatch:
env:
    TAGS: 1.0.${{ github.run_number }}
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        run: |
          fruits=("Manzana" "Banana" "Naranja" "Mango" "Fresa")
          for fruit in "${fruits[@]}"; do
            echo "$fruit"
          done


