name: CD
run-name: "CD - Deploy to Lambda 1.0.${{ github.event.workflow_run.run_number || inputs.ci_build_number }}"

on:
  workflow_run:
    workflows:
      - "CI"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      proyectos:
        description: 'Selecciona el proyecto a desplegar'
        required: true
        default: 'myproyecto1'
        type: choice
        options:
          - myproyecto1
          - myproyecto2
          - myproyecto3
      ci_build_number:
        description: 'Build number del pipeline CI (ej: 42)'
        required: true
        default: '0'
        type: string

env:
    TAGS: 1.0.${{ github.event.workflow_run.run_number || inputs.ci_build_number }}
jobs:
  Deploy:
    name: Deploy DEV
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Lambda DEV
        run: |  
          echo "Desplegando a Lambda DEV"
          PROYECTO="${{ inputs.proyectos || 'myproyecto1' }}"

          # Buscar el proyecto en config.yml por proyectoid
          count=$(yq e '.proyectos | length' ./config.yml)
          encontrado=false
          for i in $(seq 0 $(($count - 1))); do
            pid=$(yq e ".proyectos[$i].proyectoid" ./config.yml)
            if [ "$pid" == "$PROYECTO" ]; then
              encontrado=true
              proyectoid=$pid
              ecrRepositoryDEV=$(yq e ".proyectos[$i].ecrRepositoryDEV" ./config.yml)
              LambdaDEV=$(yq e ".proyectos[$i].LambdaDEV" ./config.yml)
              break
            fi
          done

          if [ "$encontrado" == "false" ]; then
            echo "ERROR: Proyecto '$PROYECTO' no encontrado en config.yml"
            exit 1
          fi

          echo "---- Variables cargadas ----"
          echo "proyectoid:       $proyectoid"
          echo "ecrRepositoryDEV: $ecrRepositoryDEV"
          echo "LambdaDEV:        $LambdaDEV"
          echo "----------------------------"

          echo "aws lambda update-function-code --function-name $LambdaDEV --image-uri ${{ env.AWS_USER }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ecrRepositoryDEV:${{ env.TAGS }}"