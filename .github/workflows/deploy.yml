name: CD
run-name: "CD - Build & Push to ECR 1.0.${{ github.run_number }}"

on:
  push:
    branches:
#       - main
       - develop
#   pull_request:
#     branches:
#       - main
  workflow_dispatch:
    inputs:
      proyectos:
        description: 'Selecciona el proyecto a desplegar'
        required: true
        default: 'myproyecto1'
        type: choice
        options:
          - myproyecto1
          - myproyecto2
          - myproyecto3

env:
    TAGS: 1.0.${{ github.run_number }}
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: proyecto
        run: |
          echo "Proyecto seleccionado: ${{ inputs.proyectos || 'myproyecto1' }}"
        
      - name: Carga de variables
        run: |
          # Stop execution if any command fails
          set -e

          #############
          #Obtener el archivo config.yml
          #############
          config=$(cat ./config.yml)
          echo "$config"
          #############
          #Parametros que se aplican en el despliegue, se obtienen del archivo config.yml
          #############
          echo "Obteniendo parametros del deployment"

          # Iterar el array del archivo config.yml y comparar por proyectoid
          PROYECTO="${{ inputs.proyectos || 'myproyecto1' }}"
          echo "Mi proyecto: $PROYECTO"
          encontrado=false
          count=$(echo "$config" | yq e '.proyectos | length' -)
          for i in $(seq 0 $(($count - 1))); do
            pid=$(echo "$config" | yq e ".proyectos[$i].proyectoid" -)
            if [ "$pid" == "$PROYECTO" ]; then
              encontrado=true
              echo "Proyecto encontrado: $pid"
              ecrRepoDEV=$(echo "$config" | yq e ".proyectos[$i].ecrRepositoryDEV" -)
              ecrRepoUAT=$(echo "$config" | yq e ".proyectos[$i].ecrRepositoryUAT" -)
              ecrRepoPRD=$(echo "$config" | yq e ".proyectos[$i].ecrRepositoryPRD" -)
              LambDEV=$(echo "$config" | yq e ".proyectos[$i].LambdaDEV" -)
              LambUAT=$(echo "$config" | yq e ".proyectos[$i].LambdaUAT" -)
              LambPRD=$(echo "$config" | yq e ".proyectos[$i].LambdaPRD" -)
              break
            fi
          done

          if [ "$encontrado" == "false" ]; then
            echo "ERROR: Proyecto '$PROYECTO' no encontrado en config.yml"
            exit 1
          fi
          
          echo "Mi proyecto: "${{ inputs.proyectos || 'myproyecto1' }}""
          echo "ECR Repository DEV: $ecrRepoDEV"
          echo "ECR Repository UAT: $ecrRepoUAT"
          echo "ECR Repository PRD: $ecrRepoPRD"
          echo "Lambda DEV: $LambDEV"
          echo "Lambda UAT: $LambUAT"
          echo "Lambda PRD: $LambPRD"

      - name: Set up Docker Buildx
        run: |
          
          proyect=("myproyecto1" "myproyecto2")
          for proy in "${proyect[@]}"; do
            echo "Docker images built $proy"
            pathfile=./$proy/Dockerfile
            tag=$proy:${{env.TAGS}}
            docker buildx build --file $pathfile --tag $tag .
          done

          docker images


      # - name: Build Docker image 2
      #   run: |
      #     echo "Docker images built successfully"
      #     docker buildx build --file ./myproyecto1/Dockerfile --tag dso-lambda-ecr-serverless:${{env.TAGS}}
      #     echo "Docker images tags successfully"
      #     docker build -t dso-lambda-ecr-serverless:${{env.TAGS}} -f ./myproyecto2/Dockerfile .
